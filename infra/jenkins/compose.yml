services:
  jenkins:
    build: .
    image: tusupkali-miras-jenkins:local
    container_name: tusupkali-miras-jenkins
    user: "0:0"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx1024m"
      CASC_JENKINS_CONFIG: /var/jenkins_config/jenkins.yaml
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins.yaml:/var/jenkins_config/jenkins.yaml:ro
      - ./jobs.groovy:/var/jenkins_config/jobs.groovy:ro
      - ./.secrets/known_hosts:/var/jenkins_home/.ssh/known_hosts:ro
    secrets:
      - admin_password
      - github_deploy_key
secrets:
  admin_password:
    file: ./.secrets/admin_password
  github_deploy_key:
    file: ./.secrets/github_deploy_key
volumes:
  jenkins_home:
    name: tusupkali_miras_jenkins_home
